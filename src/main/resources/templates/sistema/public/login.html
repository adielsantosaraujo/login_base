<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .login-container {
            background-color: #ffffff;
            border: 1px solid #dddddd;
            border-radius: 4px;
            padding: 32px;
            width: 100%;
            max-width: 360px;
        }

        h1 {
            font-size: 1.4rem;
            margin: 0 0 24px;
            text-align: center;
        }

        label {
            display: block;
            margin-bottom: 4px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 8px;
            margin-bottom: 16px;
            border: 1px solid #cccccc;
            border-radius: 4px;
            font-size: 1rem;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #2c5aa0;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
        }

        button:hover {
            background-color: #23477f;
        }

        .mensagem {
            color: #b00020;
            margin: 0 0 16px;
            font-size: 0.9rem;
        }

        .mensagem.info {
            color: #2c5aa0;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>Login</h1>
        <p class="mensagem" th:if="${param.error}">Usuário ou senha inválidos.</p>
        <p class="mensagem info" th:if="${param.logout}">Você saiu do sistema.</p>
        <form method="post" th:action="@{/login}">
            <label for="login">E-mail ou celular</label>
            <input id="login" name="login" type="text" autocomplete="username" required autofocus>

            <label for="senha">Senha</label>
            <input id="senha" name="senha" type="password" autocomplete="current-password" required>

            <button type="submit">Entrar</button>
        </form>
    </div>
</body>
</html>
