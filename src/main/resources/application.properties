spring.application.name=login-base

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:login_base}
spring.datasource.username=${DB_USER:login_base}
spring.datasource.password=${DB_PASSWORD:login_base}

spring.jpa.hibernate.ddl-auto=validate

server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

app.admin.email=${ADMIN_EMAIL:admin@loginbase.local}
app.admin.password=${ADMIN_PASSWORD:}
