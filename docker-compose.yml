services:
  db:
    image: postgres:17-trixie
    profiles: ["${PROFILE_DB:-local}"]
    environment:
      POSTGRES_DB: ${DB_NAME:-login_base}
      POSTGRES_USER: ${DB_USER:-login_base}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-login_base}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  app:
    build: .
    profiles: ["${PROFILE_APP:-desativado}"]
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-login_base}
      DB_USER: ${DB_USER:-login_base}
      DB_PASSWORD: ${DB_PASSWORD:-login_base}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@loginbase.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      JOGO_VELOCIDADE: ${JOGO_VELOCIDADE:-1}
    ports:
      - "80:80"

  frontend:
    build: ./frontend
    profiles: ["${PROFILE_FRONTEND:-local}"]
    environment:
      VITE_PRIMEUI_LICENSE: ${VITE_PRIMEUI_LICENSE:-}
      VITE_USE_POLLING: "true"
      BACKEND_URL: ${BACKEND_URL:-http://host.docker.internal}
      JOGO_VELOCIDADE: ${JOGO_VELOCIDADE:-1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules

  frontend-build:
    build: ./frontend
    profiles: ["build"]
    working_dir: /app
    command: npm run build
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  db-data:
  frontend-node-modules:
